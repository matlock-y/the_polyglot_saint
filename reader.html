<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Polyglot Saint Reader</title>

  <!-- Google Fonts: Newsreader (Academic Serif), Inter (Clean UI Sans), JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+JP:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />

  <!-- Supabase v2 CDN & Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
</head>
<body>

  <!-- ====================================================================
       READER HEADER (Two Rows: Collapsible Top Bar + Persistent Nav Bar)
       ==================================================================== -->
  <header class="reader-header">

    <!-- 1. Top Header (Collapsible Row): Active Languages with Checkboxes & Drag Lines (=) -->
    <div class="reader-top-row" id="reader-top-row" aria-label="Active language columns and order">
      <div class="reader-top-inner">
        <!-- Language pills are generated by reader.js from the active languages -->
      </div>
    </div>

    <!-- 2. Second Header (Persistent Row): Home | < Chapter > | Cards # | Ruby Toggles | Display v -->
    <div class="reader-nav-row">

      <!-- Left Controls: Home Icon, Chapter Stepper, Cards Button -->
      <div class="reader-nav-left">
        <a href="index.html" class="btn-reader-home" title="Back to Home Dashboard" aria-label="Back to Home Dashboard">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/>
          </svg>
        </a>

        <nav class="reader-chapter-stepper" aria-label="Chapter navigation">
          <a href="#prev" class="btn-step-arrow" title="Previous Chapter" aria-label="Previous Chapter">&lsaquo;</a>
          <h1 class="reader-chapter-title">&nbsp;</h1>
          <a href="#next" class="btn-step-arrow" title="Next Chapter" aria-label="Next Chapter">&rsaquo;</a>
        </nav>

        <button type="button" class="btn-chapter-cards" title="View flashcards saved from this chapter">
          <span>Cards</span>
          <span class="cards-count-badge">0</span>
        </button>
      </div>

      <!-- Right Controls: Ruby Toggles (ふり, 汉, 漢) & Display Collapse Toggle -->
      <div class="reader-nav-right">
        <div class="ruby-toggles-group" role="group" aria-label="Ruby annotation toggles">
          <button
            type="button"
            class="btn-ruby-toggle active"
            title="Toggle Japanese Furigana (jpn)"
            aria-pressed="true"
            onclick="toggleRubyClass(this, 'hide-furi')"
          >
            ふり
          </button>

          <button
            type="button"
            class="btn-ruby-toggle active"
            title="Toggle Simplified Chinese Pinyin (zhs)"
            aria-pressed="true"
            onclick="toggleRubyClass(this, 'hide-zhs-ruby')"
          >
            汉
          </button>

          <button
            type="button"
            class="btn-ruby-toggle active"
            title="Toggle Traditional Chinese Pinyin (zht)"
            aria-pressed="true"
            onclick="toggleRubyClass(this, 'hide-zht-ruby')"
          >
            漢
          </button>
        </div>

        <button
          type="button"
          class="btn-display-toggle"
          id="btn-display-toggle"
          aria-expanded="true"
          aria-controls="reader-top-row"
          onclick="toggleTopLanguageBar()"
        >
          <span>Display</span>
          <svg class="display-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <!-- Continue with Google / Sign Out button -->
        <button type="button" class="btn-google-auth btn-google-auth-reader">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
          </svg>
          <span class="auth-btn-text">Continue with Google</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ====================================================================
       MAIN PARALLEL READING AREA (3 Evenly Split Columns: eng, jpn, spa)
       ==================================================================== -->
  <main class="reader-main">
    <div class="reader-message">Loading…</div>
  </main>

  <!-- Library index (prev/next navigation), shared names, reader controller -->
  <script src="data/manifest.js"></script>
  <script src="names.js"></script>
  <script src="reader.js"></script>
</body>
</html>
